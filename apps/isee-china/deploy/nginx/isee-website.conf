# Public entry: nginx listens on 8080.
# Next.js stays on loopback: 127.0.0.1:3000.
#
# Install on the VPS:
#   cp deploy/nginx/isee-website.conf /etc/nginx/sites-available/isee-website.conf
#   ln -sfn /etc/nginx/sites-available/isee-website.conf /etc/nginx/sites-enabled/isee-website.conf
# Then disable any other server that already listens on 8080
# (a second listen 8080 will fail nginx -t).
#   nginx -t && systemctl reload nginx

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Next.js streaming / RSC: nginx buffers by default.
        # https://nextjs.org/docs/app/guides/self-hosting#reverse-proxy
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header X-Accel-Buffering no;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
